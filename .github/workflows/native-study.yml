name: Native diagnostic baseline

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra measurement
      - run: uv run --no-sync pytest tests/test_native_study.py tests/test_native_cohort.py tests/test_measurement.py
      - run: uv run --no-sync python scripts/research/run_native_study.py
      - name: Retain diagnostic aggregate evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-study-evidence-${{ github.run_id }}
          path: |
            artifacts/native-study/cohort-manifest.json
            artifacts/native-study/cohort-verification.json
            artifacts/native-study/study-config.json
            artifacts/native-study/study.json
            artifacts/native-study/freeze.json
            artifacts/native-study/progress.json
          retention-days: 14
