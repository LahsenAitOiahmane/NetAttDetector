name: Quality and smoke training

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.13']
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync python scripts/check_repository.py
      - run: uv run --no-sync python scripts/data/make_pcap_fixtures.py --check
      - run: uv run --no-sync pytest
      - run: uv run --no-sync python scripts/data/make_smoke_data.py
      - run: uv run --no-sync netatt train --data data/processed/smoke.csv --config configs/ci.json --output artifacts/smoke
      - name: Publish synthetic smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-smoke-python-${{ matrix.python }}
          path: artifacts/smoke/
          retention-days: 7
