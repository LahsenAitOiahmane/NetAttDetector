name: Context diagnostic comparison

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra measurement --extra artifacts
      - run: uv run --no-sync pytest tests/test_context_study.py tests/test_private_artifacts.py tests/test_causal_context.py tests/test_statistical_study.py tests/test_native_study.py
      - run: uv run --no-sync python scripts/research/run_context_study.py
      - name: Retain aggregates and recipient-encrypted model only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: context-study-evidence-${{ github.run_id }}
          path: |
            artifacts/context-study/measurements/fixture-verification.json
            artifacts/context-study/measurements/manifest.json
            artifacts/context-study/measurements/base-measurements/manifest.json
            artifacts/context-study/measurements/base-measurements/core-manifest.json
            artifacts/context-study/core-verification.json
            artifacts/context-study/statistical-verification.json
            artifacts/context-study/context-verification.json
            artifacts/context-study/study-config.json
            artifacts/context-study/study.json
            artifacts/context-study/freeze.json
            artifacts/context-study/progress.json
            artifacts/context-study/transfer.json
            artifacts/context-study/selected.nadenc
          retention-days: 30
