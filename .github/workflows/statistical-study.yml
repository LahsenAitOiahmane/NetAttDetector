name: Statistical diagnostic comparison

on:
  workflow_call:
    inputs:
      information_bound:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      information_bound:
        description: 'Compute no-fit information bounds instead of model selection'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra measurement
      - run: uv run --no-sync pytest tests/test_information_bound.py tests/test_statistical_study.py tests/test_statistical.py tests/test_measurement.py tests/test_native_study.py
      - if: ${{ !inputs.information_bound }}
        run: uv run --no-sync python scripts/research/run_statistical_study.py
      - if: ${{ inputs.information_bound }}
        run: uv run --no-sync python scripts/research/run_statistical_study.py --information-bound
      - name: Retain measured aggregates and diagnostic comparison only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statistical-study-evidence-${{ github.run_id }}
          path: |
            artifacts/statistical-study/measurements/fixture-verification.json
            artifacts/statistical-study/measurements/core-manifest.json
            artifacts/statistical-study/measurements/manifest.json
            artifacts/statistical-study/core-verification.json
            artifacts/statistical-study/statistical-verification.json
            artifacts/statistical-study/study-config.json
            artifacts/statistical-study/study.json
            artifacts/statistical-study/freeze.json
            artifacts/statistical-study/progress.json
            artifacts/statistical-study/information-bound.json
            artifacts/statistical-study/configuration.json
          retention-days: 14
