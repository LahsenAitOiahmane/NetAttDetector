name: Research dataset benchmark

on:
  workflow_dispatch:
    inputs:
      profile:
        description: CPU budget profile
        type: choice
        options: [laptop, benchmark]
        default: benchmark
  push:
    branches: [codex/modernize-nids-foundation]
    paths:
      - '.github/workflows/train.yml'
      - 'src/**'
      - 'configs/**'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  group: research-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PROFILE: ${{ inputs.profile || 'benchmark' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra boosting
      - run: uv run --no-sync pytest
      - run: uv run --no-sync netatt doctor --output reports/local/runner.json
      - run: uv run --no-sync netatt download nf-unsw-nb15-v2 --max-mib 512
      - run: uv run --no-sync netatt download nf-ton-iot-v2 --max-mib 512
      - name: Train and evaluate on a second dataset
        shell: bash
        run: >-
          uv run --no-sync netatt train
          --data data/raw/nf-unsw-nb15-v2.zip
          --external data/raw/nf-ton-iot-v2.zip
          --config "configs/${PROFILE}.json"
          --output artifacts/benchmark
      - name: Job summary
        if: success()
        shell: bash
        run: cat artifacts/benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish experiment artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-benchmark-${{ github.run_id }}
          path: |
            artifacts/benchmark/
            reports/local/runner.json
            data/raw/*.manifest.json
          if-no-files-found: warn
          retention-days: 14
