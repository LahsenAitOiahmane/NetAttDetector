name: Offline flow measurement lab

on:
  workflow_dispatch:
    inputs:
      statistical_study:
        description: 'Run registered fixed-thread core versus richer statistical models'
        type: boolean
        default: false
      statistical_features:
        description: 'Validate richer measured flow statistics and unchanged core/label joins'
        type: boolean
        default: false
      native_error_diagnostics:
        description: 'Run registered native error slices and fixed-thread controls'
        type: boolean
        default: false
      native_study:
        description: 'Run registered experimental native-feature fits (no deployment)'
        type: boolean
        default: false
      native_cohort:
        description: 'Prepare and verify the private native candidate cohort (no training)'
        type: boolean
        default: false
      packet_label_audit:
        description: 'Run the registered development packet-witness experiment'
        type: boolean
        default: false
      capture_label_audit:
        description: 'Also acquire and audit bounded IoT-23 development captures'
        type: boolean
        default: false
      record_first:
        description: 'Record first capture acquisition hashes (no training)'
        type: boolean
        default: false
      capture_profile:
        description: 'Registered development acquisition profile'
        type: choice
        options: [foundation, expansion]
        default: foundation
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/netattdetector/measurement.py'
      - 'src/netattdetector/statistical.py'
      - 'tests/test_statistical.py'
      - 'scripts/data/make_statistical_fixture.py'
      - 'src/netattdetector/resources.py'
      - 'tests/test_measurement.py'
      - 'scripts/data/make_pcap_fixtures.py'
      - 'tests/fixtures/pcap/**'
      - '.github/workflows/measurements.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/netattdetector/measurement.py'
      - 'src/netattdetector/statistical.py'
      - 'tests/test_statistical.py'
      - 'scripts/data/make_statistical_fixture.py'
      - 'src/netattdetector/resources.py'
      - 'tests/test_measurement.py'
      - 'scripts/data/make_pcap_fixtures.py'
      - 'tests/fixtures/pcap/**'
      - '.github/workflows/measurements.yml'

permissions:
  contents: read

concurrency:
  group: offline-measurements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  statistical-study:
    if: github.event_name == 'workflow_dispatch' && inputs.statistical_study
    uses: ./.github/workflows/statistical-study.yml
  statistical-features:
    if: github.event_name == 'workflow_dispatch' && inputs.statistical_features
    uses: ./.github/workflows/statistical-features.yml
  native-errors:
    if: github.event_name == 'workflow_dispatch' && inputs.native_error_diagnostics
    uses: ./.github/workflows/native-study.yml
    with:
      diagnostics: true
  native-study:
    if: github.event_name == 'workflow_dispatch' && inputs.native_study
    uses: ./.github/workflows/native-study.yml
  native-cohort:
    if: github.event_name == 'workflow_dispatch' && inputs.native_cohort
    uses: ./.github/workflows/native-cohort.yml
  packet-labels:
    if: github.event_name == 'workflow_dispatch' && inputs.packet_label_audit
    uses: ./.github/workflows/packet-labels.yml
  development-labels:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_label_audit
    uses: ./.github/workflows/capture-labels.yml
    with:
      record_first: ${{ inputs.record_first }}
      profile: ${{ inputs.capture_profile }}
  fixture-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra measurement
      - run: uv run --no-sync pytest tests/test_measurement.py tests/test_statistical.py
      - run: uv run --no-sync python scripts/data/make_pcap_fixtures.py --check
      - run: uv run --no-sync netatt export-pcap --pcap tests/fixtures/pcap/core.pcap --output artifacts/measurements/export.json
      - run: uv run --no-sync netatt verify-measurements --export artifacts/measurements/export.json --expected tests/fixtures/pcap/expected.json --output artifacts/measurements/verification.json
      - run: uv run --no-sync netatt measurement-contract --output artifacts/measurements/contract.json
      - run: uv run --no-sync netatt export-statistical-pcap --pcap tests/fixtures/pcap/core.pcap --output artifacts/measurements/statistical-export.json
      - run: uv run --no-sync netatt verify-statistical --export artifacts/measurements/statistical-export.json --output artifacts/measurements/statistical-verification.json
      - name: Retain offline fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-measurements-${{ github.run_id }}
          path: artifacts/measurements/
          retention-days: 14
