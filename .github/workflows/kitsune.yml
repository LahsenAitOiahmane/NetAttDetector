name: Kitsune development packet audit

on:
  workflow_call:
    inputs:
      native:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      native:
        description: 'Also validate registered candidate phase labels and complete native measurement parity'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.17'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra measurement
      - run: uv run --no-sync pytest tests/test_kitsune.py tests/test_kitsune_native.py tests/test_pcapng_audit.py tests/test_packet_evidence.py
      - run: uv run --no-sync python scripts/research/prepare_kitsune.py acquire
      - run: uv run --no-sync python scripts/research/prepare_kitsune.py audit
      - if: ${{ inputs.native }}
        run: uv run --no-sync python scripts/research/prepare_kitsune_native.py
      - name: Retain aggregate source and packet-label evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitsune-development-${{ github.run_id }}
          path: |
            data/raw/kitsune-mirai/acquisition.json
            data/raw/kitsune-mirai/progress.json
            artifacts/kitsune-packet-audit.json
            data/processed/kitsune-native/fixture.json
            data/processed/kitsune-native/packet-audit.json
            data/processed/kitsune-native/manifest.json
          retention-days: 30
