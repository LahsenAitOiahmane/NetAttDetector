[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netattdetector"
version = "0.3.0"
description = "Resource-conscious, reproducible network intrusion detection research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.16,<2",
  "scikit-learn>=1.7.2,<2",
  "joblib>=1.5,<2",
  "psutil>=7,<8",
  "threadpoolctl>=3.6,<4",
]

[project.optional-dependencies]
boosting = ["xgboost>=3.1,<4"]
analysis = ["matplotlib>=3.10,<4"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
netatt = "netattdetector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
